<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack — Admin Login</title>
</head>
<body>

  <div class="page">

    <!-- Left: branding panel -->
    <div class="left">
      <div class="left-logo">
        <div class="left-logo-icon"></div>
        <span class="left-logo-name">EcoTrack</span>
      </div>

      <div class="left-body">
        <div class="left-tag">Admin Panel</div>
        <h1 class="left-headline">Manage. Monitor. <span>Make it cleaner.</span></h1>
        <p class="left-desc">
          Review waste reports submitted by citizens, update their status,
          and keep your city clean — all from one place.
        </p>
      </div>

      <div class="left-stats">
        <div class="stat-item">
          <div class="stat-num">00</div>
          <div class="stat-lbl">Total reports</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">01</div>
          <div class="stat-lbl">Pending</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">02</div>
          <div class="stat-lbl">Resolved</div>
        </div>
      </div>
    </div>

    <div class="form-footer">
          EcoTrack Admin &nbsp;·&nbsp; v1.0 &nbsp;·&nbsp; © 2025
    </div>


  </div>

</body>
</html>
