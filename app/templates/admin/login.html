<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack — Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #04342C;
      --green-700: #0F6E56;
      --green-600: #1D9E75;
      --green-400: #5DCAA5;
      --gray-900:  #1A1A18;
      --gray-700:  #2C2C2A;
      --gray-500:  #5F5E5A;
      --gray-300:  #B4B2A9;
      --white:     #FFFFFF;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--gray-900);
      color: var(--white);
    }

    /* ── Layout ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 440px;
      min-height: 100vh;
    }

    /* ── Left panel ── */
    .left {
      background: var(--green-900);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }
    .left::before, .left::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: .06;
      background: var(--green-400);
    }
    .left::before { width: 520px; height: 520px; bottom: -160px; left: -120px; }
    .left::after  { width: 300px; height: 300px; top: -80px; right: -60px; }

    .left-logo {
      display: flex; align-items: center; gap: 10px;
      position: relative; z-index: 1;
    }
    .left-logo-icon {
      width: 36px; height: 36px;
      background: var(--green-600);
      border-radius: 8px;
    }
    .left-logo-name { font-size: 18px; font-weight: 600; color: var(--white); }

    .left-body { position: relative; z-index: 1; }
    .left-tag {
      display: inline-block;
      font-family: var(--mono); font-size: 11px;
      color: var(--green-400);
      background: rgba(93,202,165,.12);
      border: 1px solid rgba(93,202,165,.2);
      border-radius: 4px; padding: 4px 10px;
      margin-bottom: 20px;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .left-headline {
      font-size: 38px; font-weight: 600; line-height: 1.15;
      color: var(--white); letter-spacing: -.6px; margin-bottom: 16px;
    }
    .left-headline span { color: var(--green-400); }
    .left-desc {
      font-size: 15px; line-height: 1.65;
      color: rgba(255,255,255,.5); max-width: 360px;
    }

    .left-stats { display: flex; gap: 32px; position: relative; z-index: 1; }
    .stat-num { font-size: 26px; font-weight: 600; color: var(--green-400); line-height: 1; }
    .stat-lbl { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 4px; }

   
    /* footer */
    .form-footer {
      margin-top: 28px; text-align: center;
      font-size: 12px; color: var(--gray-500);
    }

    /* responsive */
    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; }
      .left { display: none; }
      .right { min-height: 100vh; }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- Left: branding panel -->
    <div class="left">
      <div class="left-logo">
        <div class="left-logo-icon"></div>
        <span class="left-logo-name">EcoTrack</span>
      </div>

      <div class="left-body">
        <div class="left-tag">Admin Panel</div>
        <h1 class="left-headline">Manage. Monitor. <span>Make it cleaner.</span></h1>
        <p class="left-desc">
          Review waste reports submitted by citizens, update their status,
          and keep your city clean — all from one place.
        </p>
      </div>

      <div class="left-stats">
        <div class="stat-item">
          <div class="stat-num">1</div>
          <div class="stat-lbl">Total reports</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">1</div>
          <div class="stat-lbl">Pending</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">1</div>
          <div class="stat-lbl">Resolved</div>
        </div>
      </div>
    </div>

   
  </div>

</body>
</html>
