<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f2f2f2;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    /* MAIN CONTAINER */

    .container{
      width:100%;
      max-width:1200px;
      min-height:90vh;

      display:flex;
      flex-wrap:wrap;

      background:white;
      border-radius:15px;
      overflow:hidden;

      box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }

    /* SIDEBAR */

    .sidebar{
      flex:1 1 250px;

      background:linear-gradient(to bottom,#063b1e,#0a6b2f);

      color:white;
      padding:25px;

      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-size:30px;
      font-weight:bold;
      margin-bottom:40px;
    }

    .menu{
      list-style:none;
    }

    .menu li{
      padding:15px;
      margin-bottom:12px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .menu li:hover{
      background:rgba(255,255,255,0.15);
    }

    .active{
      background:#16a34a;
    }

    .dark-mode{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:40px;
    }

    .toggle{
      width:50px;
      height:24px;
      background:white;
      border-radius:30px;
      position:relative;
    }

    .toggle::before{
      content:"";
      width:20px;
      height:20px;
      background:#16a34a;
      border-radius:50%;
      position:absolute;
      top:2px;
      right:2px;
    }

    /* MAIN CONTENT */

    .main{
      flex:3 1 700px;
      padding:40px;
    }

    .main h1{
      font-size:35px;
      margin-bottom:10px;
      color:#111;
    }

    .subtitle{
      color:gray;
      margin-bottom:35px;
    }

    /* FORM SECTION */

    .form-container{
      display:flex;
      flex-wrap:wrap;
      gap:30px;
    }

    /* UPLOAD BOX */

    .upload-box{
      flex:1 1 300px;

      min-height:300px;

      border:2px dashed #d4d4d4;
      border-radius:12px;

      display:flex;
      justify-content:center;
      align-items:center;

      text-align:center;
      padding:20px;

      color:#666;
      overflow: hidden;
    }
    #previewImage{
        display:none;
        width:100%;
        height:100%;
        object-fit: cover;
        border-radius:10px;
    }

    #imageInput{
        margin-top:10px;
    }

    .upload-box h2{
      font-size:60px;
      color:#16a34a;
      margin-bottom:10px;
    }

    /* FORM */

    .form{
      flex:2 1 400px;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#333;
    }

    .input-group input,
    .input-group select,
    .input-group textarea{
      width:100%;
      padding:14px;

      border:1px solid #ddd;
      border-radius:8px;

      font-size:15px;
      outline:none;
    }

    .input-group textarea{
      resize:none;
      min-height:130px;
    }

    .submit-btn{
      width:100%;

      padding:16px;

      border:none;
      border-radius:10px;

      background:#15803d;
      color:white;

      font-size:16px;
      cursor:pointer;

      transition:0.3s;
    }

    .submit-btn:hover{
      background:#166534;
    }

    /* RESPONSIVE */

    @media(max-width:768px){

      .main{
        padding:25px;
      }

      .main h1{
        font-size:28px;
      }

      .sidebar{
        min-height:auto;
      }

    }

    @media(max-width:500px){

      .main{
        padding:18px;
      }

      .main h1{
        font-size:24px;
      }

      .upload-box{
        min-height:220px;
      }

      .submit-btn{
        padding:14px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">

      <div>

        <div class="logo">
          EcoTrack
        </div>

        <ul class="menu">
          <li>Dashboard</li>
          <li class="active">Submit Report</li>
          <li>My Reports</li>
          <li>Notifications</li>
          <li>Settings</li>
        </ul>

      </div>

      <div class="dark-mode">
        <span>Dark Mode</span>
        <div class="toggle"></div>
      </div>

    </div>

    <!-- MAIN CONTENT -->

    <div class="main">

      <h1>Submit Waste Report</h1>

      <p class="subtitle">
        Help us keep your city clean.
      </p>

      <form class="form-container" method="post" action="/submit_report" enctype="multipart/form-data">

        <!-- UPLOAD -->

        <div class="upload-box">

            <div id="uploadContent">

                <h2>☁</h2>

                <p id="fileName">
                    No file selected
                </p>

                <br>

                <input
                    type="file"
                    name="image"
                    id="imageInput"
                    accept="image/*"
                >

                <br><br>

                <small>
                    PNG, JPG up to 5MB
                </small>

            </div>

            <img id="previewImage">

        </div>

        <!-- FORM -->

        <div class="form">

          <div class="input-group">
            <label>Location</label>

            <input
              type="text"
              placeholder="Enter location or area"
              name="location"
            >
          </div>

          <div class="input-group">

            <label>Waste Type</label>

            <select name="waste_type">
              <option>Select waste type</option>
              <option>Plastic</option>
              <option>Organic</option>
              <option>Metal</option>
              <option>Electronic</option>
            </select>

          </div>

          <div class="input-group">

            <label>Description</label>

            <textarea
            name="description"
              placeholder="Describe the issue..."
            ></textarea>

          </div>

          <button class="submit-btn">
            Submit Report
          </button>

        </div>

      </form>

    </div>

  </div>

<script>

const imageInput = document.getElementById("imageInput");
const previewImage = document.getElementById("previewImage");

console.log(imageInput);
console.log(previewImage);

imageInput.addEventListener("change", function(){
    const file = this.files[0];

    if(file){
        const reader = new FileReader();

        reader.onload = function(e){
            previewImage.src = e.target.result;
            previewImage.style.display = "block";
            document.getElementById("uploadContent").style.display = "none"; 
        }

        reader.readAsDataURL(file);
    }
});

</script>

</body>
</html>
