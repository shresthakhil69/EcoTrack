<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Submitted</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1200px;
    min-height:90vh;
    display:flex;
    flex-wrap:wrap;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

/* Sidebar */

.sidebar{
    flex:1 1 250px;
    background:linear-gradient(to bottom,#063b1e,#0a6b2f);
    color:white;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.logo{
    font-size:30px;
    font-weight:bold;
    margin-bottom:40px;
}

.menu{
    list-style:none;
}

.menu li{
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.menu li:hover{
    background:rgba(255,255,255,.15);
}

.menu li a{
    color:white;
    text-decoration:none;
    display:block;
    width:100%;
    height:100%;
}

.active{
    background:#16a34a;
}

.dark-mode{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:40px;
}

.toggle{
    width:50px;
    height:24px;
    background:white;
    border-radius:30px;
    position:relative;
}

.toggle::before{
    content:"";
    width:20px;
    height:20px;
    background:#16a34a;
    border-radius:50%;
    position:absolute;
    top:2px;
    right:2px;
}

/* Main */

.main{
    flex:3 1 700px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.success-card{
    width:100%;
    max-width:600px;
    background:white;
    border:1px solid #e5e5e5;
    border-radius:18px;
    padding:50px 40px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.success-icon{
    width:90px;
    height:90px;
    background:#dcfce7;
    color:#15803d;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:42px;
    margin-bottom:25px;
}

.success-card h1{
    color:#15803d;
    font-size:34px;
    margin-bottom:15px;
}

.success-card p{
    color:#666;
    font-size:16px;
    margin-bottom:35px;
    line-height:1.6;
}

.button-group{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:14px 28px;
    border:none;
    border-radius:10px;
    text-decoration:none;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.primary{
    background:#15803d;
    color:white;
}

.primary:hover{
    background:#166534;
}

.secondary{
    background:#f3f4f6;
    color:#333;
}

.secondary:hover{
    background:#e5e7eb;
}

/* Mobile */

@media(max-width:768px){

    .main{
        padding:25px;
    }

    .success-card{
        padding:35px 25px;
    }

    .success-card h1{
        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <div>

            <div class="logo">
                EcoTrack
            </div>

            <ul class="menu">
                <li>Dashboard</li>
                <li class="active">Submit Report</li>
                <li><a href="/my-reports">My Reports</a></li>
                <li>Notifications</li>
                <li>Settings</li>
            </ul>

        </div>

        <div class="dark-mode">
            <span>Dark Mode</span>
            <div class="toggle"></div>
        </div>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Report Submitted!
            </h1>

            <p>
                Your waste report has been submitted successfully.
                Thank you for helping keep the city clean.
            </p>

            <div class="button-group">

                <a href="/reports" class="btn primary">
                    Submit Another Report
                </a>

                <a href="/" class="btn secondary">
                    View My Reports
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
