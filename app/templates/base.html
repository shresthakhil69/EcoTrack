<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% block title %}EcoTrack{% endblock %}</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background: #f5f5f5;
    }

    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: linear-gradient(to bottom, #013220, #015c32);
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      left: 0;
      top: 0;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .menu {
      list-style: none;
    }

    .menu li {
      margin: 10px 0;
    }

    .menu a {
      display: block;
      padding: 15px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .menu a:hover {
      background: #0b7a43;
    }

    .logout-btn {
      display: block;
      padding: 15px;
      border-radius: 10px;
      color: white;
      text-align: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.1);
      transition: 0.2s ease;
    }

    .logout-btn:hover {
      background: #b22222;
    }

    .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
      min-height: 100vh;
      padding: 30px;
    }
  </style>

  {% block extra_styles %}{% endblock %}
</head>

<body>

  <aside class="sidebar">
    <div>
      <div class="logo">EcoTrack</div>

      <ul class="menu">
        <li><a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a></li>
        <li><a href="{{ url_for('reports.reports') }}">Submit Report</a></li>
        <li><a href="{{ url_for('my_report.my_report') }}">My Reports</a></li>
        <li><a href="#">Notifications</a></li>
        <li><a href="{{ url_for('setting.setting') }}">Settings</a></li>
        <li><a href="#">Help & Support</a></li>
      </ul>
    </div>

    <a href="{{ url_for('user_auth.logout') }}" class="logout-btn">Logout</a>
  </aside>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
