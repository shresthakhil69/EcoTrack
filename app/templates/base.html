<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% block title %}EcoTrack{% endblock %}</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background: #f5f5f5;
    }

    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: linear-gradient(to bottom, #013220, #015c32);
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      left: 0;
      top: 0;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .menu {
      list-style: none;
    }

    .menu li {
      margin: 10px 0;
    }

    .menu a {
      display: block;
      padding: 15px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .menu a:hover {
      background: #0b7a43;
    }

    .logout-btn {
      display: block;
      padding: 15px;
      border-radius: 10px;
      color: white;
      text-align: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.1);
      transition: 0.2s ease;
    }

    .logout-btn:hover {
      background: #b22222;
    }

    .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
      min-height: 100vh;
      padding: 30px;
    }

    /* Dark Mode */
    body.dark { background: #1a1a2e; color: #e0e0e0; }
    body.dark .main-content { background: #1a1a2e; }
    body.dark .sidebar { background: linear-gradient(to bottom, #0a0a1a, #0d2137); }

    /* Cards and containers */
    body.dark .card,
    body.dark .report-card,
    body.dark .table-container,
    body.dark .main-box,
    body.dark .settings-menu,
    body.dark .notif-card { background: #16213e; color: #e0e0e0; }

    /* Tables */
    body.dark table th { background: #0f3460; color: #e0e0e0; }
    body.dark table td { color: #e0e0e0; border-bottom-color: #2a2a4a; }

    /* Inputs */
    body.dark input,
    body.dark select,
    body.dark textarea {
        background: #0f3460;
        color: #e0e0e0;
        border-color: #2a2a4a;
    }

    /* Text */
    body.dark h1, body.dark h2, body.dark h3 { color: #e0e0e0; }
    body.dark p, body.dark label { color: #aaaaaa; }

    /* Badges and highlights */
    body.dark .notif-card.unread { background: #1a2a1a; }
    body.dark .menu-item { color: #cccccc; }
    body.dark .menu-item:hover { background: #1a2a3a; }



  </style>

  {% block extra_styles %}{% endblock %}
</head>

<body class="{{ 'dark' if session.get('dark_mode') == 1 else '' }}">

  <aside class="sidebar">
    <div>
      <div class="logo">EcoTrack</div>

      <ul class="menu">
        <li><a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a></li>
        <li><a href="{{ url_for('report.submit') }}">Submit Report</a></li>
        <li><a href="{{ url_for('my_report.my_report') }}">My Reports</a></li>
        <li><a href="{{ url_for('notification.notifications') }}">Notifications</a></li>
        <li><a href="{{ url_for('setting.setting') }}">Settings</a></li>
        <li><a href="#">Help & Support</a></li>
      </ul>
    </div>

    <a href="{{ url_for('home.home') }}" class="logout-btn">Logout</a>
  </aside>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
