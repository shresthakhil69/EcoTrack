<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack – Smart Waste Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* HERO */
    .hero {
      min-height: 100vh;
      padding-top: var(--nav-height);
      position: relative; overflow: hidden;
      display: flex; align-items: center;
    }
    .hero-bg-img {
      position: absolute; inset: 0;
      background-image: url("your-hero-image.jpg");
      background-size: cover;
      background-position: center 40%;
      background-repeat: no-repeat;
      z-index: 0;
    }
    .hero-bg-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(4,15,7,0.88) 0%, rgba(4,15,7,0.65) 50%, rgba(4,15,7,0.3) 100%),
        linear-gradient(180deg, rgba(4,15,7,0.35) 0%, transparent 50%, rgba(4,15,7,0.6) 100%);
      z-index: 1;
    }
    .hero-content {
      position: relative; z-index: 2; padding: 0 64px; max-width: 600px;
      animation: fadeInLeft 0.9s ease both;
    }
    @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
    .hero-eyebrow { font-size: 14px; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
    .hero-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(50px,7vw,80px); font-weight: 900; line-height: 1;
      color: var(--white); margin-bottom: 24px; text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .hero-title .g { color: var(--green); }
    .hero-subtitle {
      font-size: 17px; color: #c0d8c5; margin-bottom: 44px; line-height: 1.6; max-width: 440px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }
    .hero-subtitle .highlight { color: var(--green); font-weight: 700; }
    .hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }
    .hero-btn {
      display: inline-block; padding: 15px 44px;
      background: linear-gradient(135deg,var(--green2),var(--green3));
      border: none; border-radius: 4px;
      font-size: 16px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; text-decoration: none; font-family: "Barlow", sans-serif;
      color: white; box-shadow: 0 4px 24px rgba(45,184,74,0.4);
      transition: opacity 0.25s;
    }
    .hero-btn:hover { opacity: 0.88; }
    /* NAVBAR */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-height);
      background: rgba(6,26,16,0.92);
      backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; z-index: 200;
      border-bottom: 1px solid rgba(57,231,95,0.15);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon-box {
      width: 38px; height: 38px;
      background: linear-gradient(135deg,var(--green2),var(--dark3));
      border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1; }
    .logo-name { font-size: 20px; font-weight: 900; color: var(--white); letter-spacing: 2px; font-family: "Barlow Condensed", sans-serif; }
    .logo-tagline { font-size: 9px; color: var(--gray); letter-spacing: 1.5px; text-transform: uppercase; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { text-decoration: none; font-size: 15px; font-weight: 600; color: #ccd8cc; letter-spacing: 0.3px; transition: color 0.2s; }
    .nav-links a.active { color: var(--green); }
    .nav-links a:hover { color: var(--green); }
    .nav-cta {
      background: linear-gradient(135deg,var(--green2),var(--green3));
      color: white; border: none; padding: 12px 24px; border-radius: 6px;
      font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
      transition: opacity 0.2s; font-family: "Barlow", sans-serif;
    }
    .nav-cta:hover { opacity: 0.85; }
    :root {
      --dark:       #061a10;
      --dark2:      #0b2a18;
      --dark3:      #0e3320;
      --green:      #39e75f;
      --green2:     #2db84a;
      --green3:     #1a8c32;
      --white:      #ffffff;
      --gray:       #8ba89a;
      --nav-height: 72px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { background: #040f07; font-family: "Barlow", sans-serif; }

    /* PRELOADER */
    #preloader {
      position: fixed; inset: 0; width: 100%; height: 100vh;
      background: radial-gradient(circle at top right, rgba(57,231,95,0.15), transparent 40%),
        linear-gradient(160deg,#040f07 0%,#061a10 35%,#082010 60%,#040e07 100%);
      display: flex; justify-content: center; align-items: center;
      z-index: 999999; transition: opacity 0.6s ease;
    }
    .preloader-content { text-align: center; }
    .loader-ring {
      width: 120px; height: 120px;
      border: 4px solid rgba(57,231,95,0.15);
      border-top: 4px solid #39e75f;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      margin: auto; position: relative;
    }
    .loader-ring::before {
      content: "♻"; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 52px; color: #39e75f;
    }
    .loader-text {
      margin-top: 28px; font-size: 34px; font-weight: 900;
      letter-spacing: 4px; color: white;
      font-family: "Barlow Condensed", sans-serif;
    }
    .loader-sub { margin-top: 10px; color: #8ba89a; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
    .loading-bar { width: 240px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 10px; margin: 24px auto 0; overflow: hidden; }
    .loading-progress { width: 0%; height: 100%; background: linear-gradient(90deg,#39e75f,#2db84a); animation: loading 2s linear forwards; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes loading { 100% { width: 100%; } }
  </style>
</head>
<body>

<!-- PRELOADER -->
<div id="preloader">

  <div class="preloader-content">
    <div class="loader-ring"></div>
    <div class="loader-text">ECOTRACK</div>
    <div class="loader-sub">Smart Waste Management System</div>
    <div class="loading-bar"><div class="loading-progress"></div></div>
    
  </div>
</div>
<!-- NAVBAR -->
<nav>
  <a href="#" class="nav-logo">
    <div class="logo-icon-box">♻</div>
    <div class="logo-text">
      <span class="logo-name">EcoTrack</span>
      <span class="logo-tagline">Smart Waste Management</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="#" class="active">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <button class="nav-cta">Admin</button>
</nav>
<!-- HERO -->
<section class="hero">
  <div class="hero-bg-img"></div>
  <div class="hero-bg-overlay"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">We Provide</p>
    <h1 class="hero-title">Smart <span class="g">Waste</span><br>Management<br>Solutions</h1>
    <p class="hero-subtitle">
      You've got <span class="highlight">WASTE</span>, we've got <span class="highlight">SOLUTIONS</span>!
    </p>
    <div class="hero-btns">
      <a href="/login" class="hero-btn">Login</a>
    </div>
  </div>
</section>
<script>
  window.addEventListener("load", function(){
    setTimeout(function(){
      const preloader = document.getElementById("preloader");
      preloader.style.opacity = "0";
      setTimeout(function(){ preloader.style.display = "none"; }, 600);
    }, 2000);
  });
</script>

</body>
</html>
