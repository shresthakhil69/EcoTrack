<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack – Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #1a5c35;
      --green-mid:   #2e8b57;
      --green-light: #e8f5ee;
      --text:        #1a1a1a;
      --muted:       #6b7280;
      --border:      #d1d5db;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f1;
      font-family: 'DM Sans', sans-serif;
    }

    .card {
      display: flex;
      width: min(880px, 96vw);
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.13);
      background: #fff;
    }

    /* ── LEFT PANEL ── */
    .left {
      position: relative;
      width: 42%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: var(--green-dark);
    }

    .left::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(26,92,53,.72) 0%, rgba(46,139,87,.55) 60%, rgba(10,40,20,.85) 100%);
      z-index: 1;
    }

    .left-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding: 36px 30px 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
    }

    .brand-icon {
      width: 38px; height: 38px;
      background: rgba(255,255,255,.18);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 19px;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 23px;
      letter-spacing: .3px;
    }

    .left-caption { color: #fff; }

    .left-caption h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .left-caption p {
      font-size: 13.5px;
      opacity: .8;
      line-height: 1.6;
    }

    /* ── RIGHT PANEL (placeholder) ── */
    .right {
      flex: 1;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- LEFT -->
  <div class="left">
    <div class="left-content">
      <a href="/" class="brand">
        <div class="brand-icon">🌿</div>
        <span class="brand-name">EcoTrack</span>
      </a>
      <div class="left-caption">
        <h2>Together, let's build a cleaner tomorrow.</h2>
        <p>Track your impact, join the movement.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT (placeholder) -->
  <div class="right">
    Form coming soon…
  </div>

</div>
</body>
</html>
