<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack – Register</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #1a5c35;
      --green-mid:   #2e8b57;
      --green-light: #e8f5ee;
      --text:        #1a1a1a;
      --muted:       #6b7280;
      --border:      #d1d5db;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f1;
      font-family: 'DM Sans', sans-serif;
    }

    .card {
      display: flex;
      width: min(880px, 96vw);
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.13);
      background: #fff;
    }

    /* ── LEFT PANEL ── */
    .left {
      position: relative;
      width: 42%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: var(--green-dark);
    }

    .left::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(26,92,53,.72) 0%, rgba(46,139,87,.55) 60%, rgba(10,40,20,.85) 100%);
      z-index: 1;
    }

    .left-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding: 36px 30px 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
    }

    .brand-icon {
      width: 38px; height: 38px;
      background: rgba(255,255,255,.18);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 19px;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 23px;
      letter-spacing: .3px;
    }

    .left-caption { color: #fff; }

    .left-caption h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .left-caption p {
      font-size: 13.5px;
      opacity: .8;
      line-height: 1.6;
    }

    /* ── RIGHT PANEL ── */
    .right {
      flex: 1;
      padding: 40px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .right .sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .input-wrap svg.icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      width: 16px; height: 16px;
      pointer-events: none;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }

    input:focus { border-color: var(--green-mid); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--green-mid);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-bottom: 14px;
    }

    .btn-primary:hover { background: var(--green-dark); }

    .login-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .login-link a {
      color: var(--green-mid);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- LEFT -->
  <div class="left">
    <div class="left-content">
      <a href="/" class="brand">
        <div class="brand-icon">🌿</div>
        <span class="brand-name">EcoTrack</span>
      </a>
      <div class="left-caption">
        <h2>Together, let's build a cleaner tomorrow.</h2>
        <p>Track your impact, join the movement.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h1>Create Account</h1>
    <p class="sub">Join us and make a difference.</p>

    <div class="input-wrap">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <input type="text" placeholder="Full Name"/>
    </div>

    <div class="input-wrap">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <input type="email" placeholder="Email Address"/>
    </div>

    <div class="input-wrap">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <input type="password" placeholder="Password"/>
    </div>

    <div class="input-wrap">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <input type="password" placeholder="Confirm Password"/>
    </div>

    <button class="btn-primary">Register</button>
    <p class="login-link">Already have an account? <a href="/login">Login here</a></p>
  </div>

</div>
</body>
</html>
