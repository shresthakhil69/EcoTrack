<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcoTrack – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #1a5c35;
      --green-mid:  #2e8b57;
      --green-light:#e8f5ee;
      --text:       #1a1a1a;
      --muted:      #6b7280;
      --border:     #d1d5db;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'DM Sans', sans-serif;
    }

    .card {
      display: flex;
      width: min(860px, 96vw);
      min-height: 540px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.13);
      background: #fff;
    }

    .left {
      position: relative;
      width: 42%;
      flex-shrink: 0;
      background: var(--green-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 28px 28px;
      overflow: hidden;
    }

    .left::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(46,139,87,.55) 0%, rgba(26,92,53,.9) 60%);
      z-index: 1;
    }

    .left-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .left-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      margin-bottom: auto;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,.18);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      letter-spacing: .3px;
    }

    .left-caption {
      color: rgba(255,255,255,.9);
      text-align: center;
      margin-bottom: 20px;
    }

    .left-caption h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .left-caption p {
      font-size: 13.5px;
      opacity: .8;
      line-height: 1.55;
    }

    .right {
      flex: 1;
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- LEFT -->
  <div class="left">
    <img class="left-photo" src="your-image.jpg" alt="Smart recycling bin on a city street"/>
    <div class="left-content">
      <a href="/" class="brand">
        <div class="brand-icon">🌿</div>
        <span class="brand-name">EcoTrack</span>
      </a>
      <div class="left-caption">
        <h2>Keep Your City Clean</h2>
        <p>Smart recycling, smarter cities.<br/>Every action counts.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT (empty for now) -->
  <div class="right"></div>

</div>
</body>
</html>
